<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Book's - Products</title>

    <style>
       body {
            font-family: Arial, sans-serif;
            background-image: url("6.jpg");
            background-position: center;
            color: black;
			 background-repeat: no-repeat;
          background-attachment: fixed;
          background-size:500%;
        }
		
		/* Navigation Bar */
        nav {
            display: flex;
            justify-content: center;
            gap: 5px;
            padding: 30px; 
			transform: translateY(-3px);
        }

        nav a {
            text-decoration: none;
            color: Black;
            padding: 5px 5px;
			background-color:lightgreen;
				
        }
		nav a:hover {
            background:red;
            transform: translateY(-3px);
	    
		}
		

        .container {
            max-width: 850px;
            margin: 60px auto;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            text-align: center;
			
		}
		
		
        header {
            text-align: center;
        }

        nav a {
            color: black;
            text-decoration: none;
            margin:10px;
            font-weight: bold;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 40px;
            flex-wrap: wrap;
        }

        .product {
            background-color:pink;
            width: 220px;
            padding: 20px;
            text-align: center;
            border: 2px solid #fbefff;
            border-radius: 15px;
            box-shadow: 0 4px 10px #87cefa;
        }

        .product img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }

        .product h2 {
            color: #ff1493;
        }

        .price {
            color: #d63384;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background-color: #ff69b4;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff1493;
        }
		
	footer { 
		    text-align: center;
        }

	
    </style>
</head>

</nav>

    </div>
