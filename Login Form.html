<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cute Records</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
        }
        /* Login Container Styling */
        .login-box {
            background:lightgreen;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }
		
		body {
          background-image: url(1.jpg);
          background-repeat: no-repeat;
          background-attachment: fixed;
          background-size: 100% 100%;
        .login-box h2 {
            color: red;
            margin-bottom: 20px;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .login-box button {
            width: 100%;
            padding: 10px;
            background-color: pink;
            color:white;
            border:solid ;
            border-radius: 100px;
            cursor: pointer;
            font-size: 16px;
        }
        .error-msg {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        /* Hidden Content Styling */
        #content-section {
            display: none; /* Keeps table hidden until login */
            width: 100%;
            max-width: 1100px;
            background: glass;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1.title {
            color:black;
            text-align: center;
            font-family: serif;
            font-weight: bold;
        }
        /* Table Styling matching your image */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background-color: Black;
            color: #00ffff;
            padding: 12px;
            text-align: center;
            font-size: 18px;
        }
        td {
            padding: 10px;
            color: #a52a2a;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }
		
		}
        /* Table Section Styling */
        .table-container {
            display: none; /* Hidden by default */
            width: 100%;
            max-width: 1000px;
            background:white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #7fdbff;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: white;
            text-align: center;
            color: #2c3e50;
        }
        tr:nth-child(even) {
            background-color: pink;
        }
		
    </style>
</head>		
<body>


    <!-- 1. LOGIN FORM SECTION -->
	
    <div id="login-section" class="login-box">
	<img src="mylogo.jpg" width="50"
	     height="70" border="0"		 
         alt="text describe the image" />
		 
        <h1>Welcome Back</h1>
		<h2>Login to continue your journey<h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <a href="Home.html"><i class="fas-fa-sign-out-alt">
		<button type="submit"</i>Login</a></button>
	
    </div>	
	<!-- 3. JAVASCRIPT FOR AUTHENTICATION LOGIC -->
    <script>
        function checkLogin() {
            var user = document.getElementById("username").value;
            var pass = document.getElementById("password").value;
            
            // Set your credentials here
            var correctUser = "makey";
            var correctPass = "talasan";

            if (user === correctUser && pass === correctPass) {
                document.getElementById("login-section").style.display = "none";
                document.getElementById("content-section").style.display = "block";
            } else {
                document.getElementById("error").style.display = "block";
            }
        }
    </script>
</body>
</html>
